# Service único: selecciona TODOS los pods con app=tienda (stable y canary).
# NodePort 30080 -> accesible en http://localhost:30080 con Docker Desktop.
apiVersion: v1
kind: Service
metadata:
  name: tienda
  labels:
    app: tienda
spec:
  type: NodePort
  selector:
    app: tienda
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
